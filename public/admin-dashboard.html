<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Crystal Jewelz</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
    header { background: linear-gradient(135deg, #4a148c 0%, #7b1fa2 100%); color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .container { max-width: 1200px; margin: 0 auto; padding: 1rem; }
    .tabs { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; border-bottom: 2px solid #e0e0e0; }
    .tab-btn { padding: .85rem 1rem; border: 0; background: transparent; cursor: pointer; color: #777; font-weight: 700; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: #7b1fa2; border-bottom-color: #7b1fa2; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .panel { background: white; padding: 1.25rem; border-radius: 8px; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
    label { display: block; margin: .7rem 0 .25rem; font-weight: 650; }
    input, textarea, select { width: 100%; padding: .7rem; border: 1px solid #ccc; border-radius: 4px; font: inherit; }
    textarea { min-height: 90px; resize: vertical; }
    button, .btn { border: 0; padding: .7rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 700; }
    .btn { background: #7b1fa2; color: white; }
    .btn-secondary { background: #e0e0e0; color: #222; }
    .btn-danger { background: #c62828; color: white; }
    .message { padding: .8rem; border-radius: 8px; margin-bottom: 1rem; display: none; }
    .message.success { display: block; background: #e8f5e9; color: #1b5e20; }
    .message.error { display: block; background: #ffebee; color: #b71c1c; }
    .product-card { background: white; padding: 1rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); display: grid; grid-template-columns: 96px 1fr auto; gap: 1rem; align-items: center; margin-bottom: .75rem; }
    .product-card img { width: 96px; height: 80px; object-fit: cover; border-radius: 6px; background: #eee; }
    .actions { display: flex; gap: .5rem; flex-wrap: wrap; }
    .thumbs { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .5rem; }
    .thumb { position: relative; }
    .thumb img { width: 72px; height: 58px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
    .thumb button { position: absolute; top: -7px; right: -7px; padding: 0; width: 22px; height: 22px; border-radius: 50%; background: #c62828; color: white; }
    .muted { color: #777; font-size: .9rem; }
    .preview-logo { max-height: 56px; max-width: 180px; object-fit: contain; display: block; margin-top: .5rem; }
    .logout-btn { background: rgba(255,255,255,.25); color: white; }
    @media (max-width: 760px) { .grid, .grid-3, .product-card { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><h1>Admin Dashboard</h1><button class="logout-btn" onclick="logout()">Logout</button></header>
  <main class="container">
    <div id="message" class="message"></div>
    <nav class="tabs">
      <button class="tab-btn active" onclick="switchTab('products')">Producten</button>
      <button class="tab-btn" onclick="switchTab('homepage')">Homepage</button>
      <button class="tab-btn" onclick="switchTab('appearance')">Logo & stijl</button>
      <button class="tab-btn" onclick="switchTab('settings')">Instellingen</button>
    </nav>

    <section id="products" class="tab-content active">
      <div class="panel">
        <h2>Product toevoegen</h2>
        <form id="productForm" onsubmit="saveProduct(event)">
          <input type="hidden" name="id">
          <div class="grid">
            <div><label>Naam *</label><input name="name" required></div>
            <div><label>Prijs *</label><input name="price" type="number" step="0.01" required></div>
          </div>
          <div class="grid-3">
            <div><label>Categorie</label><select name="category"><option value="bracelets">Bracelets</option><option value="necklaces">Necklaces</option><option value="rings">Rings</option><option value="earrings">Earrings</option><option value="anklets">Anklets</option><option value="other">Other</option></select></div>
            <div><label>Voorraad</label><input name="stock" type="number" min="0" value="1"></div>
            <div><label>Uniek exemplaar</label><select name="is_unique"><option value="1">Ja, meestal 1 stuk</option><option value="0">Nee, meerdere beschikbaar</option></select></div>
          </div>
          <label>Korte beschrijving</label><textarea name="description"></textarea>
          <label>Uitgebreide beschrijving</label><textarea name="long_description"></textarea>
          <label>Hoofdfoto</label>
          <input type="file" accept="image/*" onchange="uploadToField(this, 'image_url')">
          <input name="image_url" id="image_url" placeholder="/uploads/foto.jpg">
          <label>Extra foto's</label>
          <input type="file" accept="image/*" multiple onchange="uploadGallery(this)">
          <div id="galleryPreview" class="thumbs"></div>
          <input type="hidden" name="images" id="images">
          <label><input type="checkbox" name="featured" style="width:auto"> Featured op homepage</label>
          <div class="actions" style="margin-top:1rem;"><button class="btn" type="submit">Opslaan</button><button class="btn-secondary" type="button" onclick="resetProductForm()">Nieuw/leegmaken</button></div>
        </form>
      </div>
      <div id="productList"></div>
    </section>

    <section id="homepage" class="tab-content">
      <div class="panel">
        <h2>Homepage teksten</h2>
        <form id="homepageForm" onsubmit="saveHomepage(event)">
          <label>Hero titel</label><input name="hero_title">
          <label>Hero subtitel</label><textarea name="hero_subtitle"></textarea>
          <div class="grid-3">
            <div><label>Blok 1 titel</label><input name="about1_title"><label>Blok 1 icoon/woord</label><input name="about1_icon"><label>Blok 1 tekst</label><textarea name="about1_text"></textarea></div>
            <div><label>Blok 2 titel</label><input name="about2_title"><label>Blok 2 icoon/woord</label><input name="about2_icon"><label>Blok 2 tekst</label><textarea name="about2_text"></textarea></div>
            <div><label>Blok 3 titel</label><input name="about3_title"><label>Blok 3 icoon/woord</label><input name="about3_icon"><label>Blok 3 tekst</label><textarea name="about3_text"></textarea></div>
          </div>
          <div class="grid"><div><label>Featured titel</label><input name="featured_title"></div><div><label>Featured subtitel</label><input name="featured_subtitle"></div></div>
          <button class="btn" type="submit">Homepage opslaan</button>
        </form>
      </div>
    </section>

    <section id="appearance" class="tab-content">
      <div class="panel">
        <h2>Logo, kleuren en lettertype</h2>
        <form id="settingsForm" onsubmit="saveSiteSettings(event)">
          <label>Merknaam</label><input name="brand_name">
          <label>Logo</label><input type="file" accept="image/*" onchange="uploadToField(this, 'logo_url')"><input name="logo_url" id="logo_url"><img id="logoPreview" class="preview-logo" alt="">
          <div class="grid-3"><div><label>Primaire kleur</label><input type="color" name="primary_color"></div><div><label>Accentkleur</label><input type="color" name="accent_color"></div><div><label>Achtergrond</label><input type="color" name="background_color"></div></div>
          <label>Lettertype</label><select name="font_family"><option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">System / modern</option><option value="Georgia, serif">Georgia / klassiek</option><option value="'Trebuchet MS', sans-serif">Trebuchet / zacht</option><option value="Arial, sans-serif">Arial</option></select>
          <button class="btn" type="submit">Stijl opslaan</button>
        </form>
      </div>
    </section>

    <section id="settings" class="tab-content">
      <div class="panel"><h2>Wachtwoord wijzigen</h2><form onsubmit="changePassword(event)"><label>Nieuw wachtwoord</label><input name="newPassword" type="password" minlength="8" required><button class="btn" type="submit">Wachtwoord opslaan</button></form></div>
    </section>
  </main>

  <script>
    let galleryImages = [];
    function switchTab(id) { document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active')); document.getElementById(id).classList.add('active'); event?.target?.classList.add('active'); }
    function showMessage(text, type = 'success') { const el = document.getElementById('message'); el.textContent = text; el.className = 'message ' + type; setTimeout(() => { el.className = 'message'; }, 3500); }
    function logout() { fetch('/admin/logout').then(() => location.href = '/admin/login'); }
    function escapeHtml(value) { return String(value || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    async function api(url, options = {}) { const res = await fetch(url, options); const data = await res.json().catch(() => ({})); if (!res.ok) throw new Error(data.error || 'Request failed'); return data; }
    async function uploadFile(file) { const fd = new FormData(); fd.append('image', file); const res = await fetch('/api/admin/upload', { method: 'POST', body: fd }); const data = await res.json(); if (!res.ok || !data.url) throw new Error(data.error || 'Upload failed'); return data.url; }
    async function uploadToField(input, fieldId) { try { const url = await uploadFile(input.files[0]); document.getElementById(fieldId).value = url; if (fieldId === 'logo_url') document.getElementById('logoPreview').src = url; showMessage('Foto geupload'); } catch (err) { showMessage(err.message, 'error'); } finally { input.value = ''; } }
    async function uploadGallery(input) { try { for (const file of input.files) galleryImages.push(await uploadFile(file)); renderGallery(); showMessage('Gallery bijgewerkt'); } catch (err) { showMessage(err.message, 'error'); } finally { input.value = ''; } }
    function renderGallery() { document.getElementById('images').value = JSON.stringify(galleryImages); document.getElementById('galleryPreview').innerHTML = galleryImages.map((url, i) => `<span class="thumb"><img src="${url}"><button type="button" onclick="removeGallery(${i})">x</button></span>`).join(''); }
    function removeGallery(i) { galleryImages.splice(i, 1); renderGallery(); }
    function formDataObject(form) { const data = Object.fromEntries(new FormData(form)); data.featured = Boolean(form.featured?.checked); data.is_unique = data.is_unique === '1'; data.images = JSON.parse(data.images || '[]'); return data; }
    function resetProductForm() { document.getElementById('productForm').reset(); document.querySelector('#productForm [name=id]').value = ''; galleryImages = []; renderGallery(); document.querySelector('#productForm h2')?.remove(); }
    async function saveProduct(event) { event.preventDefault(); const form = event.target; const data = formDataObject(form); const id = form.id.value; try { if (id) await api('/api/admin/products/' + id, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) }); else await api('/api/admin/products', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) }); showMessage('Product opgeslagen'); resetProductForm(); loadProducts(); } catch (err) { showMessage(err.message, 'error'); } }
    async function loadProducts() { try { const products = await api('/api/admin/products'); document.getElementById('productList').innerHTML = products.map(p => `<div class="product-card"><img src="${p.image_url || ''}" alt=""><div><h3>${escapeHtml(p.name)}</h3><p>${escapeHtml(p.description || '')}</p><p class="muted">${escapeHtml(p.category)} - voorraad: ${p.stock} ${p.is_unique ? '- uniek exemplaar' : ''}</p><strong>€${Number(p.price || 0).toFixed(2)}</strong></div><div class="actions"><button class="btn-secondary" onclick="editProduct(${p.id})">Bewerk</button><button class="btn-danger" onclick="deleteProduct(${p.id})">Verwijder</button><a class="btn-secondary" href="/product/${p.id}" target="_blank">Bekijk</a></div></div>`).join(''); } catch (err) { showMessage(err.message, 'error'); } }
    async function editProduct(id) { try { const p = await api('/api/admin/products/' + id); const form = document.getElementById('productForm'); for (const [k, v] of Object.entries(p)) if (form.elements[k]) form.elements[k].value = v ?? ''; form.featured.checked = Boolean(p.featured); form.is_unique.value = p.is_unique ? '1' : '0'; galleryImages = (p.images || []).map(img => img.image_url); renderGallery(); window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (err) { showMessage(err.message, 'error'); } }
    async function deleteProduct(id) { if (!confirm('Product verwijderen?')) return; try { await api('/api/admin/products/' + id, { method: 'DELETE' }); showMessage('Product verwijderd'); loadProducts(); } catch (err) { showMessage(err.message, 'error'); } }
    async function loadHomepage() { const hp = await api('/api/admin/homepage'); const form = document.getElementById('homepageForm'); Object.entries(hp).forEach(([k, v]) => { if (form.elements[k]) form.elements[k].value = v || ''; }); }
    async function saveHomepage(event) { event.preventDefault(); try { await api('/api/admin/homepage', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(Object.fromEntries(new FormData(event.target))) }); showMessage('Homepage opgeslagen'); } catch (err) { showMessage(err.message, 'error'); } }
    async function loadSiteSettings() { const s = await api('/api/admin/site-settings'); const form = document.getElementById('settingsForm'); Object.entries(s).forEach(([k, v]) => { if (form.elements[k]) form.elements[k].value = v || ''; }); document.getElementById('logoPreview').src = s.logo_url || ''; }
    async function saveSiteSettings(event) { event.preventDefault(); try { await api('/api/admin/site-settings', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(Object.fromEntries(new FormData(event.target))) }); showMessage('Stijl opgeslagen'); } catch (err) { showMessage(err.message, 'error'); } }
    async function changePassword(event) { event.preventDefault(); try { await api('/api/admin/password', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(Object.fromEntries(new FormData(event.target))) }); showMessage('Wachtwoord aangepast'); event.target.reset(); } catch (err) { showMessage(err.message, 'error'); } }
    document.addEventListener('DOMContentLoaded', () => { loadProducts(); loadHomepage(); loadSiteSettings(); });
  </script>
</body>
</html>
