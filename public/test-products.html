<!DOCTYPE html>
<html>
<head>
    <title>Test Products</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
        .card h3 { margin: 0 0 10px 0; }
        .price { font-weight: bold; color: green; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>Crystal Jewelz - Products Test</h1>
    <div id="status">Loading...</div>
    <div id="products" class="products"></div>

    <script>
        async function loadAndDisplay() {
            try {
                document.getElementById('status').textContent = 'Fetching products...';
                const resp = await fetch('/api/products');
                document.getElementById('status').textContent = `Response status: ${resp.status}`;
                
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                
                const products = await resp.json();
                document.getElementById('status').textContent = `✅ Got ${products.length} products!`;
                
                const html = products.slice(0, 12).map(p => `
                    <div class="card">
                        <h3>${p.name}</h3>
                        <p><strong>${p.category}</strong></p>
                        <p>${p.description}</p>
                        <div class="price">$${p.price}</div>
                    </div>
                `).join('');
                
                document.getElementById('products').innerHTML = html;
            } catch(err) {
                document.getElementById('status').textContent = `❌ Error: ${err.message}`;
                console.error(err);
            }
        }
        
        window.addEventListener('DOMContentLoaded', loadAndDisplay);
    </script>
</body>
</html>
