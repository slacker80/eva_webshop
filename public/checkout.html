<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout - Crystal Jewelz</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 1rem; background: #f8f9fa; color: #333; max-width: 600px; margin: auto; }
    h1 { color: #4a148c; margin-bottom: 1rem; }
    form { background: white; padding: 1rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    label { display: block; margin: 0.5rem 0 0.25rem; font-weight: 600; }
    input, textarea { width: 100%; padding: 0.5rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 1rem; padding: 0.75rem 1rem; border: none; background: linear-gradient(135deg, #7b1fa2 0%, #d4af37 100%); color: white; border-radius: 25px; font-weight: 600; cursor: pointer; width: 100%; }
    button:disabled { background: grey; }
  </style>
</head>
<body>
  <h1>Afrekenen</h1>

  <form id="checkoutForm">
    <label for="name">Naam *</label>
    <input type="text" id="name" name="name" required />

    <label for="email">E-mailadres *</label>
    <input type="email" id="email" name="email" required />

    <label for="address">Bezorgadres *</label>
    <textarea id="address" name="address" rows="3" required></textarea>

    <button type="submit">Betaal via iDEAL</button>
  </form>

  <script>
    document.getElementById('checkoutForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Verwerken...';

      const data = {
        name: e.target.name.value.trim(),
        email: e.target.email.value.trim(),
        address: e.target.address.value.trim()
      };

      try {
        const res = await fetch('/pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          const json = await res.json();
          window.location.href = json.paymentUrl;
        } else {
          const err = await res.json();
          alert('Fout bij betaling: ' + (err.error || 'Onbekende fout'));
          btn.disabled = false;
          btn.textContent = 'Betaal via iDEAL';
        }
      } catch (error) {
        alert('Netwerkfout, probeer het opnieuw.');
        btn.disabled = false;
        btn.textContent = 'Betaal via iDEAL';
      }
    });
  </script>
</body>
</html>
