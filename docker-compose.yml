services:
  eva-webshop:
    image: ${IMAGE_NAME:-ghcr.io/slacker80/eva_webshop}:${IMAGE_TAG:-local}
    build:
      context: .
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      BASE_URL: ${BASE_URL:-https://crystaljewelz.nl}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /root/eva_data:/app/data
      - /root/eva_uploads:/app/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
