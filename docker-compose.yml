version: '3.8'

services:
  eva-webshop:
    build: .
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=your-super-secret-session-key-here-change-in-production
      - ADMIN_PASSWORD=your-secure-admin-password
    volumes:
      - crystal-jewelz-db:/app
      - /root/eva_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  crystal-jewelz-db:
    driver: local
